DEBUG = false

study = "mira-biomedbert-ptbxl"
task = "classification"
model = "mira_biomedbert"

# PTB-XL: 12-lead ECG, 10 s. 100 Hz -> 1000 samples; the fork center-crops to
# history_len. 512 mirrors the fork's default classification window.
history_len = 512
pred_len = 512            # unused for classification but read by the config


[data]
dataset = "PTB-XL"
mode = "multivariate"
cols = "all"
normalize = true
step = 512


[training]
epochs = 20
batch_size = 8            # MIRA-large + BiomedBERT is heavy; lower if OOM
optimizer = "adamw"
learning_rate = 1e-4
dropout = 0.1
loss = "ce"

eval_metric = "accuracy"
eval_metric_direction = "max"


[datasets.PTB-XL]
version = "v1"


[models.mira_biomedbert]
d_fuse = 256             # common fusion width
n_heads = 8             # cross-attention heads (leads attend over text)
d_head = 32
sampling_rate = 100.0   # must match datasets/ptbxl.py sampling_rate

# --- Time-series branch: MIRA backbone -------------------------------------
[models.mira_biomedbert.ts]
# Point repo_path at your local clone of https://github.com/microsoft/MIRA
# so that `import MIRA.models.modeling_mira` succeeds. Adjust import_module to
# match the actual package folder casing in your clone.
repo_path = "/path/to/MIRA"
import_module = "MIRA.models.modeling_mira"
config_module = "MIRA.models.configuration_mira"

# checkpoint options (pick ONE):
#   - "MIRA-Mode/MIRA"  : community DEMO reproduction on HF (NOT full-scale).
#   - "/path/to/ckpt"   : a local MIRA checkpoint dir (from_pretrained format).
#   - "random"          : random init from architecture (needs allow_random_init).
# NOTE: the official full-scale 454B-token MIRA weights are not publicly
# released as of writing. See INTEGRATION.md.
checkpoint = "MIRA-Mode/MIRA"
allow_random_init = false
freeze = true            # use MIRA as a frozen feature extractor

# only used when checkpoint = "random"
[models.mira_biomedbert.ts.random_config]
input_size = 1
hidden_size = 384
intermediate_size = 1024
num_hidden_layers = 12
num_attention_heads = 6
num_experts = 8
num_experts_per_tok = 2
time_aware_rotary = true
use_terminal_ode = false    # ODE not needed for classification features


# --- Text branch: BiomedBERT -----------------------------------------------
[models.mira_biomedbert.text]
model = "microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext"
max_len = 64
freeze = true            # set false + lora = true to adapt the text encoder
lora = false
lora_rank = 8
lora_alpha = 16
lora_dropout = 0.05


[setup]
seed = 0
device = "auto"
dtype = "mixed"
num_workers = "auto"
logger = "print"
